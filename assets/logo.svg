<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cc-logo-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14897a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1c8c99" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="cc-logo-bar-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="cc-logo-bar-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffb13d" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cc-logo-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cc-logo-glow" cx="0.28" cy="0.2" r="0.65">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="cc-logo-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="cc-logo-dropshadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#06302a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Frosted glass panel: translucent gradient fill, soft rim light, and a
       diffuse highlight glow in the upper-left for the "liquid glass" feel. -->
  <rect width="512" height="512" rx="108" fill="url(#cc-logo-bg)"/>
  <rect width="512" height="512" rx="108" fill="url(#cc-logo-glow)" filter="url(#cc-logo-soft)"/>
  <rect x="3" y="3" width="506" height="506" rx="105" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>

  <!-- Three ascending bars, enlarged to fill the frame, each a glassy
       translucent slab with its own top sheen highlight - a count climbing
       as you type, the tallest capped in accent orange. -->
  <g filter="url(#cc-logo-dropshadow)">
    <rect x="70" y="256" width="104" height="186" rx="32" fill="url(#cc-logo-bar-glass)"/>
    <rect x="204" y="158" width="104" height="284" rx="32" fill="url(#cc-logo-bar-glass)"/>
    <rect x="338" y="70" width="104" height="226" rx="32" fill="url(#cc-logo-bar-accent)"/>
  </g>
  <rect x="70" y="256" width="104" height="80" rx="32" fill="url(#cc-logo-sheen)"/>
  <rect x="204" y="158" width="104" height="100" rx="32" fill="url(#cc-logo-sheen)"/>
  <rect x="338" y="70" width="104" height="80" rx="32" fill="url(#cc-logo-sheen)"/>

  <rect x="70" y="256" width="104" height="186" rx="32" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
  <rect x="204" y="158" width="104" height="284" rx="32" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
  <rect x="338" y="70" width="104" height="226" rx="32" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
</svg>
